tagline: つくることと、知らない仕組みをのぞくことが好きです。
tagline_en: I like making things and looking under the hood to see how they work.
bio: |-
  仕組みが気になると、まず自分で触って確かめたくなる性格です。FPVドローンを組むこと、Raspberry PiやESP32で遊ぶこと、セキュリティやAIを試すことが好きです。

  画面の中だけで終わらず、組んだ機体が飛ぶ、無線がつながる、作ったものを誰かが使ってくれる。そんな瞬間を楽しみに、身近な「こうだったらいいな」を少しずつ形にしています。

  外ではスキーや空撮を楽しんでいて、最近はロープワークも練習しています。このサイトには、いま夢中になっていることと、これまでに作ったものを載せています。
bio_en: |-
  When something makes me curious, I usually want to take it apart, try it, and understand it for myself. I enjoy building FPV drones, tinkering with Raspberry Pi and ESP32 boards, and experimenting with security and AI.

  I like the moment when something leaves the screen and becomes real: a quad I built takes off, a radio link connects, or a small tool becomes useful to someone. Most of my projects start with a simple thought: “I wish this were a little easier.”

  Away from the desk, I enjoy skiing and aerial photography. I have also been learning rope work lately. This site is a small collection of what I am into and what I have made.
location: Japan
