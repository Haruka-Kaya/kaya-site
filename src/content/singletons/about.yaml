tagline: FPVドローン自作 / セキュリティリサーチ / アマチュア無線 / ロープアクセス
tagline_en: FPV drone builder · security researcher · licensed radio operator · rope access enthusiast
bio: "コーダーというよりも、ハードウェアとAIツールを理解して使いこなすことが得意なタイプ。

DarwinFPV Cementシリーズの自作機や防水FPV機を飛ばしながら、第二級陸上特殊無線技士の免許を活かしてデジタルVTXを合法運用している。DJI Air 3SはDIPSに登録してドローン保険にも加入済み。旅行先での空撮に使っている。

セキュリティはLinuxをいじるうちに自然と引き込まれた。HackerOneでCriticalレベルの脆弱性を発見・報告した経験があり、TryHackMeで継続学習中。AIエージェント（特にMCP）をバグバウンティや自律コーディングへ応用することに取り組んでいる。

スキー12年。アイスクライミングを視野に入れながら、セミスタティックロープのレスキュー技術を自主練習している。"
bio_en: "Less of a coder, more of someone who understands and wields hardware and AI tools effectively.

Builds custom FPV quads (DarwinFPV Cement series, including a waterproof build) and holds a 2nd-class land special radio operator license for legal digital VTX operation. Also operates a DJI Air 3S registered with DIPS and insured for liability — mainly used for aerial photography during travel.

Got pulled into security while tinkering with Linux. Has found and responsibly disclosed Critical-severity vulnerabilities through HackerOne, and continuously trains on TryHackMe. Actively applying AI agents (MCP-based autonomous workflows) to bug bounty and security research.

12 years of skiing. Practicing rope access rescue techniques with semi-static systems, with ice climbing as a long-term goal."
location: Japan
