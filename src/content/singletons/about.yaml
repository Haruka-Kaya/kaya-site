bio: |-
  仕組みが気になると、まず自分で触って確かめたくなる性格です。HackerOneでセキュリティを調べたり、FPVドローンを組んだり、Raspberry PiやESP32で遊んだりしています。

  身近な面倒を少し減らす道具や、遊びながら学べるものを作っています。予定やメールを扱うAI、名札を彫るためのソフト、自作のレースゲーム。うまくいかなかった話も、制作のこぼれ話として残しています。

  画面の外では、組んだ機体が飛ぶこと、無線がつながること、作ったものを誰かが使ってくれることを楽しんでいます。スキーや空撮、最近始めたロープワークも好きです。
bio_en: |-
  When something makes me curious, I want to try it and understand it for myself. I research security through HackerOne, build FPV drones, and experiment with Raspberry Pi and ESP32 boards.

  I build small tools to make everyday tasks easier and things I can learn from while playing: an AI for calendars and email, engraving software, and a racing game. The parts that go wrong also make it into my build outtakes.

  Away from the screen, I enjoy the moment when a quad I built takes off, a radio link connects, or a small tool becomes useful to someone. I also enjoy skiing, aerial photography, and learning rope work.
now: |-
  作ったものや試したことを、このサイトに少しずつまとめています。セキュリティ研究と詳しい開発記録は、技術者向けページに分けています。
now_en: |-
  Collecting the things I build and try on this site. Security research and detailed development records have their own technical section.
