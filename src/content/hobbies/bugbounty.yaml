name: Bug Bounty
description: "HackerOneのプログラムで、スコープとルールを確認しながらセキュリティ上の問題を調べ、報告しています。再現条件と証拠を残すことを大切にしています。"
description_en: "I research and report security issues through HackerOne programs, working within each program's scope and rules. I focus on preserving reproducible steps and evidence."
detail: "HackerOneをメインプラットフォームとして、許可された範囲でセキュリティ上の問題を調べ、報告しています。

まずプログラムのポリシーと対象範囲を読み、挙動を小さく切り分けます。報告では、確認できた事実、再現に必要な条件、まだ分からないことを分けて伝えるようにしています。

調査を安全に進めるため、実行前にスコープを評価し、判断と証拠を監査ログへ残す内部ツールも作っています。"
icon: 🐛
order: 7
