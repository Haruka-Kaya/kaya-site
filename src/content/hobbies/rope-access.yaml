name: Rope Access
description: "資格はまだないが、セミスタティックロープのレスキュー技術を業務レベルの内容で自主練習中。スキー12年の流れで、いつかアイスクライミングにも挑戦したい。"
description_en: "Self-training in rope access rescue techniques with semi-static systems at professional rigor. 12 years of skiing feeds the long-term goal of ice climbing."
detail: "資格はまだないが、セミスタティックロープを使ったレスキュー技術を業務レベルの内容で自主練習している。自宅と練習施設の両方でシステムを組んで、荷重・下降・引き上げを繰り返している。

スキー歴12年で、山と垂直方向の空間への親しみはずっと持ってきた。その延長でいつかアイスクライミングにも挑戦したいと思っていて、ロープアクセスはその橋渡しになる技術でもある。

市街地の垂直世界──ビルや構造物を舞台にした高所作業の世界に引き込まれているのは、地上の感覚とは別の集中が要求されるからだと思う。"
icon: 🧗
order: 4
