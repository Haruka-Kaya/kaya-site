name: Rope Access
description: "資格取得前の学習として、セミスタティックロープの基本的なシステムを安全に練習中。スキー12年の流れで、いつかアイスクライミングにも挑戦したい。"
description_en: "Learning the fundamentals of semi-static rope systems before pursuing formal qualifications. Twelve years of skiing feeds a long-term interest in ice climbing."
detail: "資格取得前の学習として、セミスタティックロープを使った基本的なシステムを安全に練習している。自宅と練習施設で、荷重・下降・引き上げの仕組みを確認している。

スキー歴12年で、山と垂直方向の空間への親しみはずっと持ってきた。その延長でいつかアイスクライミングにも挑戦したいと思っていて、ロープアクセスはその橋渡しになる技術でもある。

市街地の垂直世界──ビルや構造物を舞台にした高所作業の世界に引き込まれているのは、地上の感覚とは別の集中が要求されるからだと思う。"
icon: 🧗
order: 4
