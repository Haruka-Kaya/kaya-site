name: Rope Access
description: "自宅や練習施設でレスキュー技術とセミスタティックロープを中心に自主練習中。資格はまだないが、業務レベルのがっちりした内容に取り組んでいる。市街地での垂直世界が主戦場。スキー12年の流れでアイスクライミングにもいつか挑戦したい。"
description_en: "Self-training in rope access with a focus on rescue techniques and semi-static systems, practiced at home and training facilities in urban environments. No formal certification yet, but working at a professional level of rigor. 12 years of skiing feed the long-term goal of ice climbing."
