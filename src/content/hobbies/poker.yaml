name: ポーカー
name_en: Poker
description: ゲーム理論とGTO戦略を中心に学んでいます。TexasSolverで自分のレンジを検証しながら、ヘッズアップではsolverに近い意思決定ができることを目指しています。
description_en: Studying poker through game theory and GTO strategy. I verify my hand ranges with TexasSolver and work toward solver-calibrated decisions in heads-up situations.
detail: |-
  単なるカードゲームとしてではなく、不完全情報ゲームにおける意思決定の問題として取り組んでいます。

  TexasSolverをコンソールから呼び出すスクリプトを自作し、特定のボードでのレンジ構成を検証しています。自分の選び方と計算結果を見比べるための道具です。ポーカーを題材にすると、確率やゲーム理論を、具体的な局面に当てはめて考えられます。

  自作ツールで検証している中心は、二人で対戦するヘッズアップです。参加者が増えるマルチウェイは、同じ精度で扱えているわけではありません。計算できた条件を外れてまで、結果を正解として使わないようにしています。

  この趣味にも、プログラミングとの共通点があります。まず条件を決め、結果を比べ、どこまで言えるのかを考える。ソルバーの出力を読む練習と、それを扱うスクリプトを書く時間の両方を楽しんでいます。
detail_en: |-
  I approach poker less as a card game and more as a decision-making problem under incomplete information.

  I wrote scripts that drive TexasSolver from the console to check range construction on specific boards. They help me compare my choices with computed results. Poker gives me concrete situations in which to think about probability and game theory.

  My tool's main area of verification is heads-up play, with two participants. It does not handle multiway situations to the same standard. I try not to treat a result as an answer outside the conditions that were actually evaluated.

  There is a connection to programming here too: define the conditions, compare results, and work out what they support. I enjoy both learning to read solver output and writing the scripts that handle it.
