name: Skiing
icon: ⛷️
order: 10
description: "スキー歴12年。ゲレンデでの滑走を起点にロープアクセスやアイスクライミングへとつながるアウトドア活動の軸のひとつ。"
description_en: "12 years of skiing experience. A gateway into rope access and ice climbing — one of the threads connecting all outdoor disciplines."
detail: "滑り始めた頃は家族旅行が主だったが、今は冬山の技術全体への入口として位置づけている。ロープアクセスで身につけたセルフレスキューの知識と組み合わせ、アイスクライミングを次の目標に据えている。12年の継続で急斜面の整地・不整地の技術は一定レベルに達しているが、クランポンワーク（アイゼン歩行）はまだ習得中。"
