name: スキーとロープ
description: スキーを長く続けています。最近はロープワークも練習していて、いつかアイスクライミングに挑戦したいです。
description_en: I have been skiing for years. Lately I have also been practicing rope work, with the hope of trying ice climbing someday.
detail: |-
  スキーは12年ほど続けています。最初は家族旅行で滑ることが中心でしたが、いまでは冬に外へ出る楽しみのひとつになりました。

  最近はセミスタティックロープを使った基本的な上り下りや、レスキューを想定したシステムも練習しています。安全を確認しながら、ひとつずつ手順を身につけているところです。

  いつかアイスクライミングにも挑戦してみたいと思っています。スキーからロープへ、興味が少しずつつながっていくのが面白いです。
icon: ⛷️
order: 5
