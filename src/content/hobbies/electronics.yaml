name: Linux と電子工作
description: Linuxを触ったり、Raspberry PiやESP32で小さなものを作ったりしています。思ったとおりに動かない時間も含めて好きです。
description_en: I tinker with Linux and build small things with Raspberry Pi and ESP32 boards. I even enjoy the part where nothing works quite as expected.
detail: |-
  Linuxを触り始めたことから、サーバーや小さなコンピューターにも興味が広がりました。DebianやUbuntuを普段使いしながら、最近はArch Linuxも少しずつ試しています。

  Raspberry Pi Zero 2 WをiPadから操作できる持ち歩き用端末にしたり、ESP32やM5Stackで無線を試したりしています。必要な部品を探して、配線して、動かなければまた調べる。その繰り返しが楽しいです。

  ソフトウェアだけ、ハードウェアだけと分けずに、両方を行き来しながらひとつのものを動かすのが自分に合っています。
icon: 🔧
order: 2
