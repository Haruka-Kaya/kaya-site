name: ドローン
description: YouTubeでFPVの映像を見て、自分でも飛ばしたくなったのが始まりです。今は機体を組む時間も、旅先で空撮する時間も楽しんでいます。
description_en: I got into drones after seeing FPV videos on YouTube. These days I enjoy both building my own quads and taking aerial photos while traveling.
detail: |-
  YouTubeでFPVの映像を見ているうちに、自分でも飛ばしてみたくなりました。完成品を買うだけでは物足りなくて、フレームやモーターを選び、はんだ付けをして、設定まで自分で試したのが最初です。

  いまは小さな機体を気軽に飛ばしたり、防水仕様の機体を組んだりしています。思いどおりに飛んだ瞬間はもちろん、原因を探しながら直している時間も好きです。

  旅に出るときはDJI Air 3Sも持っていきます。地上から見ていた景色が、空からだとまったく違って見えるところが面白いです。安全やルールを守って楽しめるよう、必要な登録や無線の資格も整えています。
icon: 🚁
order: 1
