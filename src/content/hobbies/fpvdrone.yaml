name: FPV Drone
description: "YouTubeがきっかけでDarwinFPV Cementシリーズにハマり、自作を始める。防水仕様の機体も自分で設計・製作。BetaFPV Meteor 75や3.5インチ機で自宅近くを日常フライト。陸上特殊無線技士を目指してデジタルVTXの合法運用に取り組み中。"
description_en: "Got into FPV through YouTube and started building custom quads around the DarwinFPV Cement series — including a waterproof build designed from scratch. Flies a BetaFPV Meteor 75 and 3.5\" builds near home. Currently working toward a land special radio operator license to legally operate digital VTX systems."
