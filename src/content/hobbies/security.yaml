name: Security
description: "LinuxをいじっているうちにOSINT・脆弱性調査に引き込まれた。Thetis Pro-C FIDO2キーを購入・運用中。決済API（Braintree・Hyperwallet）のサンドボックス調査も実施。HackerOneとTryHackMeで継続学習中。"
description_en: "Pulled into OSINT and vulnerability research through Linux tinkering. Runs a Thetis Pro-C FIDO2/WebAuthn hardware security key. Has researched payment APIs (Braintree, Hyperwallet) in sandbox. Continuously learning via HackerOne and TryHackMe."
detail: "OSINTと脆弱性調査に引き込まれたのはLinuxをいじっているうちに「なぜこう動くのか」を追いかけていたことがきっかけだった。

物理セキュリティにも興味があって、Thetis Pro-C（FIDO2/WebAuthn対応ハードウェアセキュリティキー）を実際に購入して日常運用している。パスワードレス認証の仕組みを体感で理解したかったというのが大きい。

決済系APIの攻撃面も調査していて、BraintreeやHyperwalletのサンドボックス環境でテストを実施した。HackerOneとTryHackMeで継続学習しながら、バグバウンティの実践に繋げている。"
icon: 🔐
order: 6
