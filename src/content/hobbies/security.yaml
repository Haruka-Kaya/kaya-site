name: セキュリティとCTF
description: Linuxの仕組みを追いかけるうちに、セキュリティにも興味が広がりました。HackerOneで報告したり、TryHackMeで問題を解いたりしながら学んでいます。
description_en: Following questions about Linux led me into security. I learn by reporting findings through HackerOne and working through challenges on TryHackMe.
detail: |-
  Linuxを触っていて「なぜこう動くんだろう」と調べ始めたことが、セキュリティに興味を持つきっかけでした。

  いまはHackerOneのルールと対象範囲を確認しながら、実際のサービスで見つけた問題を報告しています。見落とされやすい境界や、仕組み同士のつながりを丁寧に追うのが好きです。

  TryHackMeやCTFにも取り組んでいます。まだ分からないことは多いですが、Web、リバースエンジニアリング、暗号などを横断しながら、少しずつ基礎を増やしています。
icon: 🔐
order: 3
